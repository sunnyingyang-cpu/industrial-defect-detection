# YOLOv5 by Ultralytics, GPL-3.0 license
# Hyperparameters for COCO training from scratch
# See tutorials for hyperparameter evolution https://github.com/ultralytics/yolov5#tutorials
#
# Optimized hyperparameters for industrial surface-defect detection (NEU-DET).
# Focus on hard classes: crazing (tiny mesh cracks) and rolled-in_scale (low-contrast streaks).
# Usage:
#   python train.py --data data/defect_neu.yaml --cfg models/defect_yolov5s_p2.yaml \
#       --weights yolov5s.pt --img 800 --batch 8 --epochs 150 --device 0 --hyp data/hyp.opt.yaml

lr0: 0.01          # initial learning rate (SGD=1E-2, Adam=1E-3)
lrf: 0.1           # final OneCycleLR learning rate (lr0 * lrf)
momentum: 0.937    # SGD momentum/Adam beta1
weight_decay: 0.0005  # optimizer weight decay 5e-4
warmup_epochs: 3.0    # warmup epochs (fractions ok)
warmup_momentum: 0.8  # warmup initial momentum
warmup_bias_lr: 0.1   # warmup initial bias lr
box: 0.05          # box loss gain
cls: 0.5           # cls loss gain
cls_pw: 1.0        # cls BCELoss positive_weight
obj: 1.0           # obj loss gain (scale with pixels)
obj_pw: 1.0        # obj BCELoss positive_weight
iou_t: 0.20        # IoU training threshold
anchor_t: 4.0      # anchor-multiple threshold
fl_gamma: 2.0      # focal loss gamma (focus hard examples: crazing / rolled-in_scale)
label_smoothing: 0.0  # label smoothing epsilon
hsv_h: 0.015       # image HSV-Hue augmentation (fraction)
hsv_s: 0.7         # image HSV-Saturation augmentation (fraction)
hsv_v: 0.6         # image HSV-Value augmentation (fraction) -> stronger brightness/contrast jitter
degrees: 0.0       # image rotation (+/- deg)
translate: 0.1     # image translation (+/- fraction)
scale: 0.5         # image scale (+/- gain)
shear: 0.0         # image shear (+/- deg)
perspective: 0.0   # image perspective (+/- fraction), range 0-0.001
flipud: 0.0        # image flip up-down (probability)
fliplr: 0.5        # image flip left-right (probability)
mosaic: 0.5        # image mosaic (probability) -> lower to avoid shrinking tiny defects further
mixup: 0.0         # image mixup (probability)
copy_paste: 0.0    # segment copy-paste (probability)
paste_in: 0.0      # segment paste-in (probability)
loss_uncertainty: False  # Loss uncertainty (automatically tunes classification and object loss gains during training)
