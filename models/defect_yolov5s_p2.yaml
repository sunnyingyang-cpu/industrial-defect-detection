# ============================================================
# defect_yolov5s_p2.yaml  (工业缺陷检测 · 推荐默认配置)
# ------------------------------------------------------------
# 基于比赛方案 yolov5s-4l.yaml，针对"微小表面缺陷"优化：
#   · 在标准 P3/P4/P5 三尺度之外，新增 P2/4 小目标检测头
#     (Detect 同时接 P2,P3,P4,P5 四个分支)，
#     专门提升划痕、龟裂等亚像素级小缺陷的召回。
#   · 锚框按缺陷尺度分布手工设定 (4 组)，训练时 YOLOv5 的
#     autoanchor 会基于验证集再微调一次，确保贴合数据。
# 参数量约 7.3M，适合在产线工控机 / 边缘设备部署。
# 如需更大感受野的多尺度版本，见 defect_yolov5s6_tr.yaml。
# ============================================================
# parameters
nc: 6  # 类别数: 6 类表面缺陷 (见 data/defect_neu.yaml)
depth_multiple: 0.33  # model depth multiple
width_multiple: 0.50  # layer channel multiple

# anchors
anchors:
  - [7,7, 10,9, 10,21] # P2/4   (小目标)
  - [16,14, 24,19, 36,27]  # P3/8
  - [23,54, 58,41, 48,108]  # P4/16
  - [92,64, 145,110, 195,230]  # P5/32

# YOLOv5 backbone
backbone:
  # [from, number, module, args]
  [[-1, 1, Focus, [64, 3]],  # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],  # 1-P2/4
   [-1, 3, C3, [128]],
   [-1, 1, Conv, [256, 3, 2]],  # 3-P3/8
   [-1, 9, C3, [256]],
   [-1, 1, Conv, [512, 3, 2]],  # 5-P4/16
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]],  # 7-P5/32
   [-1, 1, SPP, [1024, [5, 9, 13]]],
   [-1, 3, C3, [1024, False]],  # 9
  ]

# YOLOv5 head
head:
  [[-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 6], 1, Concat, [1]],  # cat backbone P4
   [-1, 3, C3, [512, False]],  # 13

   [-1, 1, Conv, [256, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 4], 1, Concat, [1]],  # cat backbone P3
   [-1, 3, C3, [256, False]],  # 17 (P3/8-small)

   [-1, 1, Conv, [128, 1, 1]],  # upper
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 2], 1, Concat, [1]],  # cat backbone P2
   [-1, 3, C3, [128, False]],  # 21 (P2/4-xsmall)

   [-1, 1, Conv, [128, 3, 2]],
   [[-1, 18], 1, Concat, [1]],  # cat head P3
   [-1, 3, C3, [256, False]],  # 24 (P3/8-small)

   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 14], 1, Concat, [1]],  # cat head P4
   [-1, 3, C3, [512, False]],  # 27 (P4/16-medium)

   [-1, 1, Conv, [512, 3, 2]],
   [[-1, 10], 1, Concat, [1]],  # cat head P5
   [-1, 3, C3, [1024, False]],  # 30 (P5/32-large)

   [[21, 24, 27, 30], 1, Detect, [nc, anchors]],  # Detect(P2,P3, P4, P5)
  ]
